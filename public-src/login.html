<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>Sign in · Shelter-Studio — SIH26051</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("shl-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body class="login-page">

  <div class="login-veil"></div>

  <div class="login-card">
    <div class="login-crest">
      <svg class="crest" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 3 L42 13 V33 L24 45 L6 33 V13 Z" fill="var(--crest-fill1)" stroke="var(--saff)" stroke-width="1.6"/>
        <path d="M24 12 L35 20 V30 L24 38 L13 30 V20 Z" fill="none" stroke="var(--txt)" stroke-width="1.1" opacity="0.85"/>
        <path d="M16.5 25.5 L24 18 L31.5 25.5" fill="none" stroke="var(--saff)" stroke-width="1.6"/>
        <path d="M19 25.5 V33 M29 25.5 V33 M16.5 33 H31.5" fill="none" stroke="var(--txt)" stroke-width="1.1"/>
        <circle cx="24" cy="14.5" r="1.6" fill="var(--green)"/>
      </svg>
    </div>
    <h1 class="login-title">Shelter-Studio</h1>
    <p class="login-sub">SIH26051 · per-account design &amp; fleet workspace</p>

    <div class="login-tabs">
      <button id="tabLogin" class="on" type="button">SIGN IN</button>
      <button id="tabSignup" type="button">REGISTER</button>
    </div>

    <form id="authForm" autocomplete="on" novalidate>
      <label class="lbl" for="fUser">USERNAME</label>
      <input id="fUser" name="username" type="text" maxlength="24" required
             autocomplete="username" placeholder="letters, digits, _ - ." />
      <label class="lbl" for="fPass">PASSWORD</label>
      <div class="pw">
        <input id="fPass" name="password" type="password" maxlength="128" required
               autocomplete="current-password" placeholder="min 6 characters" />
        <button id="pwToggle" type="button" title="Show password">👁</button>
      </div>
      <p class="hint" id="signupHint" hidden>Account creation takes 2 seconds — your designs and shelters will be saved under this login.</p>
      <div class="login-err" id="loginErr" hidden></div>
      <button id="authSubmit" class="lnd-primary btn login-submit" type="submit">SIGN IN →</button>
    </form>

    <p class="login-alt">
      <a href="dashboard.html">Continue as guest →</a> &nbsp;·&nbsp;
      <a href="index.html">Back to home</a>
    </p>
  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
